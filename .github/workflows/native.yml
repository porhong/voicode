# Builds the native mouse helpers for every supported target. Called by CI and by the
# release workflow, which bundles the uploaded artifacts into the npm package.
name: Native helpers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Native helper (${{ matrix.target }} ${{ matrix.helper }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            helper: windows
          - os: windows-latest
            target: win32-x64
            helper: audio
          - os: windows-latest
            target: win32-x64
            helper: console
          # X11 helpers build on the oldest supported Ubuntu so the binaries link
          # against an old glibc and run on older distributions too.
          - os: ubuntu-22.04
            target: linux-x64
            helper: x11
            packages: libx11-dev libxtst-dev
          - os: ubuntu-22.04-arm
            target: linux-arm64
            helper: x11
            packages: libx11-dev libxtst-dev
          # libei is only packaged from Ubuntu 24.04; the portal it relies on needs a
          # recent desktop (GNOME 46+, Plasma 6.1+) anyway.
          - os: ubuntu-24.04
            target: linux-x64
            helper: wayland
            packages: libglib2.0-dev libei-dev pkg-config
          - os: ubuntu-24.04-arm
            target: linux-arm64
            helper: wayland
            packages: libglib2.0-dev libei-dev pkg-config
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install build dependencies
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: node scripts/build-native.mjs --helper ${{ matrix.helper }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}-${{ matrix.helper }}
          path: apps/agent/native-bin/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
